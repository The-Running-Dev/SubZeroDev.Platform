# The member identity provider: Keycloak 26.8.1 on its own PostgreSQL, and a mail catcher for the
# invite and reset links. Keycloak is a deployment choice, not a Platform package (ADR-009); this
# file is the workload's whole runtime.
#
# Local and CI only. Every published port binds to 127.0.0.1, the database credentials are test
# values, and the bootstrap admin password has no default: the reader supplies one
# (`KC_BOOTSTRAP_ADMIN_PASSWORD`), generated per run. The deployment at id.subzerodev.com is deploy/identity-provider.
#
# The image is pinned by digest. Keycloak runs in production `start` mode (not `start-dev`) so the
# proof exercises the same configuration path a deployment would; plain HTTP is enabled only
# because the hostname is http://localhost, which browsers and WebAuthn treat as a secure context.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
      POSTGRES_DB: keycloak
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - identity-provider-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 2s
      timeout: 2s
      retries: 30

  # Catches the mail Keycloak sends (the realm's test-only SMTP default is mail:1025) and serves it on
  # http://localhost:8025 for the tests to read. Production mail goes through Resend instead.
  mail:
    image: axllent/mailpit:v1.27.0@sha256:fb84cfb1c3a33007cfdee8ba5a77b8c6c894de5b1a368372ddc5c965cf5c0b6d
    ports:
      - "127.0.0.1:8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 2s
      retries: 30

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1@sha256:3f3c5f8e03c614774b4bd9173b88391fefa4153bfc010d8012d59ad825377332
    command:
      - start
      - --http-enabled=true
      - --hostname=${KC_HOSTNAME:-http://localhost:8180}
      - --health-enabled=true
      - --db=postgres
    environment:
      KC_DB_URL: jdbc:postgresql://db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-bootstrap-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?set KC_BOOTSTRAP_ADMIN_PASSWORD to a generated test value}
    ports:
      - "127.0.0.1:8180:8080"
      - "127.0.0.1:9180:9000"
    depends_on:
      db:
        condition: service_healthy
      mail:
        condition: service_healthy
    mem_limit: 1536m
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 3s
      timeout: 3s
      retries: 60
      start_period: 20s

volumes:
  identity-provider-postgres:
