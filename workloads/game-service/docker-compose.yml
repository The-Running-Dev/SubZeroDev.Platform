# S3.15 / invariant 93. Provisions the durable store and nothing else: no workload instance, no
# supervision, no deployment description. The `game-service` CI job and this file's reader bring
# it up with the identical command (`design/10-design.md`, "Provisioning the store").
#
# Encoding and locale are pinned explicitly rather than inherited from the image's own default, so
# the ordered blob comparisons the proofs run (`collate "C"`, invariant 83) do not depend on which
# locale a given image build happened to ship with.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: game_service
      POSTGRES_PASSWORD: game_service
      POSTGRES_DB: game_service
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - game-service-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U game_service -d game_service"]
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  game-service-postgres:
