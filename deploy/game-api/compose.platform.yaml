# The long-lived half of game-api (modules/app `platform`): game-service's Postgres and the tunnel
# connector. Deploys redeploy only compose.yaml, so a deploy never restarts the database or drops the
# tunnel. This stack creates the two networks compose.yaml joins as external:
#
#   game-api-ingress   connector <-> game-edge. The tunnel reaches nothing else.
#   game-api-data      game-service <-> Postgres. Internal: no route off the host.
#
# POSTGRES_PASSWORD is generated by OpenTofu and shared with the deployed stack; TUNNEL_TOKEN reaches
# only this stack.
name: game-api-platform

services:
  game-api-postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: game_service
      POSTGRES_DB: game_service
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      # The C.UTF-8 collation game-service's migrations expect: byte-ordered comparisons
      # (workloads/game-service/docker-compose.yml).
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C.UTF-8
    volumes:
      - game-api-postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U game_service -d game_service]
      interval: 5s
      timeout: 5s
      retries: 20
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "3" }
    networks:
      - game-api-data

  game-api-tunnel:
    image: cloudflare/cloudflared:2025.11.1
    restart: unless-stopped
    command: [tunnel, --no-autoupdate, run]
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?Set TUNNEL_TOKEN}
    dns: [1.1.1.1, 9.9.9.9]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "3" }
    networks:
      - game-api-ingress

volumes:
  game-api-postgres:

networks:
  game-api-ingress:
    name: game-api-ingress
  game-api-data:
    name: game-api-data
    internal: true
