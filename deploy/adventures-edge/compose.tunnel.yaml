# Cloudflare Tunnel connector for this stack's own hostname (deploy/adventures-edge routes). It joins
# `proxy-net` beside the edge, so nothing is published on the host. TUNNEL_TOKEN comes from the stack
# environment (OpenTofu). The service is not called `cloudflared`: Adventures' connector already answers
# to that name on proxy-net. Layer it over compose.yaml.
services:
  adventures-edge-tunnel:
    image: cloudflare/cloudflared:2025.11.1
    restart: unless-stopped
    command: [tunnel, --no-autoupdate, run]
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?Set TUNNEL_TOKEN}
    dns: [1.1.1.1, 9.9.9.9]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "3" }
    networks:
      - proxy-net
    depends_on:
      - adventures-edge
