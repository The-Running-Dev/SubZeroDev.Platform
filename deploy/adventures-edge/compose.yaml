# Platform's edge in front of Adventures, in PassThrough mode: Adventures keeps authenticating its own
# cookie, and the edge forwards to `adventures-api:8787` over `proxy-net`, where the Adventures stack
# already runs it. Nothing is published on the host. The image is pinned by digest by each deploy
# (deploy/adventures-edge, OpenTofu; container.yml). Layer compose.tunnel.yaml over this file.
#
# This stack serves only its own health hostname until Adventures' tunnel route for
# adventures-api.subzerodev.com is pointed at `adventures-edge-ingress:8080`; that flip lives in the
# Adventures repository, and pointing it back is the rollback (workloads/game-edge/README.md).
name: adventures-edge

services:
  adventures-edge:
    image: ${ADVENTURES_EDGE_IMAGE:?Set ADVENTURES_EDGE_IMAGE}
    restart: unless-stopped
    environment:
      GameEdge__WorkloadBaseAddress: http://adventures-api:8787
      GameEdge__CredentialMode: PassThrough
      # Adventures' tunnel connector, at its fixed address on adventures-edge-ingress (below). Cloudflare
      # appends the visitor's address to X-Forwarded-For, so each player has an AbuseLimits budget of
      # their own. Any other peer, this stack's own health connector included, is counted under the
      # address it connects from.
      GameEdge__TrustedProxies__0: 10.213.80.10
    read_only: true
    tmpfs:
      - /tmp:uid=1654,gid=1654,mode=0700
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "3" }
    networks:
      proxy-net: {}
      adventures-edge-ingress:
        # The name Adventures' connector routes players to. It resolves on this network only, so the
        # connector always arrives from its trusted address; `adventures-edge` resolves on proxy-net too,
        # where the connector's address is not fixed.
        aliases: [adventures-edge-ingress]

networks:
  # Created outside every stack (`docker network create proxy-net`); external, so Compose fails fast
  # rather than starting an edge that cannot reach Adventures.
  proxy-net:
    external: true
  # Adventures' tunnel connector <-> the edge, and nothing else. This stack creates it; Adventures'
  # compose.edge.yaml joins it as external at 10.213.80.10, outside `ip_range`, so Docker never hands
  # the trusted address to another container. Docker refuses to create it if the subnet overlaps a
  # network already on the host. While Adventures' connector is attached, Compose cannot remove it:
  # detach Adventures first (its deploy/README.md, "Platform's edge").
  adventures-edge-ingress:
    name: adventures-edge-ingress
    ipam:
      config:
        - subnet: 10.213.80.0/28
          ip_range: 10.213.80.0/29
