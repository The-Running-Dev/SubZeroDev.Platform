# Cloudflare Tunnel connector for this stack (deploy/identity-provider routes): id.subzerodev.com to
# the proxy, and, only while an admin session's route exists, that hostname to Keycloak itself. It
# joins `front` only, so nothing is published on the host. TUNNEL_TOKEN comes from the stack
# environment (OpenTofu). Layer it over compose.yaml.
services:
  tunnel:
    image: cloudflare/cloudflared:2025.11.1@sha256:89ee50efb1e9cb2ae30281a8a404fed95eb8f02f0a972617526f8c5b417acae2
    restart: unless-stopped
    command: [tunnel, --no-autoupdate, run]
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?Set TUNNEL_TOKEN}
    dns: [1.1.1.1, 9.9.9.9]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "3" }
    networks:
      - front
    depends_on:
      - proxy
