name: Docs CI

# Everything documentation needs except deploy: check the authored Markdown,
# then build the combined site (docs + status-page landing site) to prove it
# still builds. No path filters -- all jobs are meant to be required status
# checks, and a required check that never runs leaves a pull request
# permanently blocked.
#
# The gate and the build are not the same check. Docusaurus fails on unresolved
# routes inside the site; the gate covers what the site build never sees --
# README.md, which is not part of the site at all, plus relative link targets,
# heading anchors, product-name casing, and drift between a generated file and
# its source. Neither one checks that site/ still merges cleanly onto the docs
# build -- that is what the verify job's extra steps are for, so a PR proves
# the deploy path before it can run for real. Neither checks that
# design/30-slices.md's Status markers stay internally consistent either --
# see the slice-status-markers job.

"on":
    pull_request:
    push:
        branches:
            - main
    workflow_dispatch:

permissions:
    contents: read
    packages: read

defaults:
    run:
        shell: pwsh

jobs:
    # --- DocumentationGate:start ---
    # The start/end markers are load-bearing: setup-docs.ps1 locates this exact
    # block by them to remove the job entirely when -SkipGate is passed. Keep
    # them if you edit this job by hand.
    documentation:
        name: Documentation links and terminology
        runs-on: ubuntu-latest

        steps:
            - name: Check out repository
              uses: actions/checkout@v7

            - name: Validate Markdown links, terminology, and generated files
              run: ./build/Test-Documentation.ps1
    # --- DocumentationGate:end ---

    # Not inside the DocumentationGate block above, deliberately: that block is
    # located by its markers and removed whole by setup-docs.ps1 -SkipGate, and
    # Test-Documentation.ps1 is installed byte-identical from the docs-template
    # image (design/d3/90-decisions.md) -- this repository's practice is not to
    # hand-edit that file, so re-running the installer keeps picking up
    # upstream fixes. This check is repository-owned and lives in its own job
    # instead, checking design/30-slices.md's Status markers stay consistent --
    # see build/Test-SliceStatusMarkers.ps1 and design/d3/40-site.md.
    slice-status-markers:
        name: Slice status markers
        runs-on: ubuntu-latest

        steps:
            - name: Check out repository
              uses: actions/checkout@v7

            - name: Validate design/30-slices.md's Status markers
              run: ./build/Test-SliceStatusMarkers.ps1

    verify:
        name: Verify Documentation Build
        # Skipped on push to main: docs-deploy.yml builds and deploys there, so
        # building again here would duplicate work every deploy performs anyway.
        if: github.event_name != 'push'
        runs-on: ubuntu-latest
        # Run inside the published base image, which already carries the
        # template under /template with node_modules and PowerShell installed.
        container:
            image: ghcr.io/the-running-dev/docs-template:latest
            credentials:
                username: ${{ github.repository_owner }}
                password: ${{ secrets.REGISTRY_TOKEN || github.token }}

        steps:
            - name: Check out repository
              uses: actions/checkout@v7

            - name: Build documentation
              run: /template/scripts/docs-build.ps1 -SourceDocs ./docs -OutputPath artifacts/docs

            # The reusable landing-page package builds this consumer-owned React
            # site. Platform retains its page code and verification; the package
            # owns the route-entry integration and protected merge.
            #
            # `check` runs format:check, lint, typecheck, vitest and the build
            # (site/package.json), not just the build. A bare `build` would let
            # a broken component test or a missing metadata tag merge and
            # deploy as long as the bundle still compiled -- `check` is what a
            # contributor runs locally before pushing, made a required step
            # here too, not a weaker CI-only substitute for it.
            - name: Build and verify the status-page site
              run: |
                  npm --prefix site ci
                  npm --prefix site run check

            - name: Merge the site into the documentation build
              run: npm --prefix site run merge

            # Run the same archiving step docs-deploy.yml uses, so the deploy
            # path is covered before merge rather than after it. This action
            # tars the site with `tar --hard-dereference`, which fails outright
            # on an image without GNU tar. Uploading an artifact publishes
            # nothing; deploy-pages does that, and it is not in this job.
            - name: Archive Pages artifact (verify deploy path)
              uses: actions/upload-pages-artifact@v5
              with:
                  path: artifacts/docs
