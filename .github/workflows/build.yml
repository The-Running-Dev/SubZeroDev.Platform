name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal

      # The sample runs both roles in a non-development environment, so CI exercises the real
      # checks rather than the development carve-outs.
      - name: Run the sample in both roles
        env:
          ASPNETCORE_ENVIRONMENT: Production
        run: |
          set -euo pipefail

          # The built executables rather than `dotnet run`, so the process signalled at the end is
          # the host itself and its exit status is the host's. Each runs from its own output
          # directory, because appsettings.json sits beside the binary and the content root
          # defaults to the working directory. `exec` replaces the subshell, so $! is the host.
          root=$PWD

          # Both roles point at one store, outside either's own output directory — the only way
          # PeerHost and SettingsFingerprint see anything besides "no peer ever registered here".
          export Platform__Persistence__ConnectionString="Data Source=$root/shared-sample.db"

          # Migrate mode creates the shared store and puts its SQLite file in WAL — a host that
          # finds a file still in the default journal mode aborts startup, per the contract, and a
          # store with no schema has nothing for the standard call's checks to be healthy against.
          ( cd "$root/samples/SubZeroDev.Platform.Sample.Web/bin/Release/net10.0" \
            && ./SubZeroDev.Platform.Sample.Web migrate )
          ( cd "$root/samples/SubZeroDev.Platform.Sample.Worker/bin/Release/net10.0" \
            && ./SubZeroDev.Platform.Sample.Worker migrate )

          ( cd "$root/samples/SubZeroDev.Platform.Sample.Web/bin/Release/net10.0" \
            && ASPNETCORE_URLS=http://127.0.0.1:5199 exec ./SubZeroDev.Platform.Sample.Web \
          ) > web.log 2>&1 &
          web=$!

          ( cd "$root/samples/SubZeroDev.Platform.Sample.Worker/bin/Release/net10.0" \
            && exec ./SubZeroDev.Platform.Sample.Worker \
          ) > worker.log 2>&1 &
          worker=$!

          fail() { echo "::error::$1"; cat web.log worker.log; kill $web $worker 2>/dev/null || true; exit 1; }

          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5199/health/ready > /dev/null 2>&1 \
              && curl -fsS http://127.0.0.1:5100/health/ready > /dev/null 2>&1; then
              break
            fi
            kill -0 $web 2>/dev/null || fail "the web host exited before serving"
            kill -0 $worker 2>/dev/null || fail "the worker host exited before serving"
            sleep 1
            [ "$attempt" -lt 30 ] || fail "neither probe answered within 30 seconds"
          done

          curl -fsS http://127.0.0.1:5199/health/live > /dev/null || fail "web liveness did not answer"

          # The worker probe is loopback-only, and its readiness answered above. Its absence from
          # the machine's routable address is asserted in the test suite rather than here.
          echo "Both roles served their probes in $ASPNETCORE_ENVIRONMENT."

          # SIGTERM is the ordinary shutdown signal, and a graceful host exits zero on it.
          kill -TERM $web $worker
          for pid in $web $worker; do
            status=0
            wait "$pid" || status=$?
            [ "$status" -eq 0 ] || fail "a sample host exited with status $status"
          done
