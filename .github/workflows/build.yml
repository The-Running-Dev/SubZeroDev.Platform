name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      # verification: true
      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal

      # S17.5: activate each capability's deliberately broken negative observation in isolation.
      # The gate accepts only the one expected, marked scenario failure; a build failure, missing
      # test, crash or unrelated assertion failure remains a CI failure rather than false evidence
      # that the mutation was caught.
      # verification: true
      - name: Reject all nine negative mutation fixtures
        run: pwsh ./build/Test-S17Mutations.ps1

      # S8.1: with no OTLP endpoint configured (the sample's appsettings.json carries none), the
      # standard registration call must start no exporter and attempt no outbound connection —
      # neither at startup nor in steady state. Rejecting the two OTLP ports before the sample runs
      # is what makes that an enforced fact rather than an assumption: if telemetry ever tried to
      # reach a collector on either, the run below would hang or fail against a firewall, not merely
      # "happen not to notice" a missing endpoint. Loopback stays open, since curl/dotnet talk to the
      # sample and to each other on 127.0.0.1 throughout the rest of this job; nothing else in this
      # job makes outbound calls, so a narrower reject than a default-deny is sufficient here.
      - name: Block outbound OTLP ports for the sample run
        run: |
          sudo iptables -A OUTPUT -o lo -j ACCEPT
          sudo iptables -A OUTPUT -p tcp --dport 4317 -j REJECT
          sudo iptables -A OUTPUT -p tcp --dport 4318 -j REJECT

      # The sample runs both roles in a non-development environment, so CI exercises the real
      # checks rather than the development carve-outs. build/Test-SampleRoundTrip.ps1 is shared with
      # release.yml's post-publish check, build/Test-PublishedPackages.ps1 (S9.2/S9.3), which runs
      # the identical script against the sample built from the published packages instead of these
      # project references.
      # verification: true
      - name: Run the sample in both roles
        env:
          ASPNETCORE_ENVIRONMENT: Production
        run: pwsh ./build/Test-SampleRoundTrip.ps1

      # S3.14 / invariant 45: the dependency direction between the framework and a hosted workload
      # is one-way. Nothing in MSBuild enforces it, so the gate is a build step rather than a
      # convention, and it runs on every push and pull request like the rest of this job.
      # verification: true
      - name: Assert no framework project references a workload
        run: pwsh ./build/Test-WorkloadIsolation.ps1

      # S17.3: isolate only the operating-system identity used by the local sample, so runner and
      # Actions traffic cannot create false positives. Loopback remains available for the sample's
      # probes; every non-loopback packet from that identity is rejected and counted.
      - name: Install the local-host outbound guard
        run: |
          sudo useradd --system --no-create-home --shell /usr/sbin/nologin platform-local-offline
          workspace_parent=$(dirname "$GITHUB_WORKSPACE")
          work_parent=$(dirname "$workspace_parent")
          runner_home=$(dirname "$work_parent")
          sudo chmod o+x "$runner_home" "$work_parent" "$workspace_parent" "$GITHUB_WORKSPACE"
          sudo -u platform-local-offline test -r "$GITHUB_WORKSPACE/build/Test-LocalHostOffline.ps1"

          offline_uid=$(id -u platform-local-offline)
          sudo iptables -N PLATFORM_LOCAL_OFFLINE
          sudo iptables -A PLATFORM_LOCAL_OFFLINE -o lo -j RETURN
          sudo iptables -A PLATFORM_LOCAL_OFFLINE -j REJECT
          sudo iptables -I OUTPUT 1 -m owner --uid-owner "$offline_uid" -j PLATFORM_LOCAL_OFFLINE
          sudo install -d -o platform-local-offline -g platform-local-offline /tmp/platform-local-offline

      # A guard that has never rejected traffic is not known to constrain anything. This deliberate
      # probe must fail and increment the same counter inspected after the real local-host run.
      # verification: true
      - name: Prove the outbound guard rejects an attempted connection
        run: |
          set +e
          sudo -u platform-local-offline env HOME=/tmp/platform-local-offline \
            curl --connect-timeout 3 --max-time 5 https://example.com >/dev/null 2>&1
          probe_status=$?
          set -e

          rejected=$(sudo iptables -L PLATFORM_LOCAL_OFFLINE -v -x -n | \
            awk '$3 == "REJECT" { total += $1 } END { print total + 0 }')
          if [ "$probe_status" -eq 0 ] || [ "$rejected" -eq 0 ]; then
            echo "the outbound guard did not reject and count its negative-control probe" >&2
            exit 1
          fi

          sudo iptables -Z PLATFORM_LOCAL_OFFLINE

      # verification: true
      - name: Run the local host with outbound networking unavailable
        run: |
          sudo -u platform-local-offline env \
            HOME=/tmp/platform-local-offline \
            DOTNET_CLI_TELEMETRY_OPTOUT=1 \
            DOTNET_SKIP_FIRST_TIME_EXPERIENCE=1 \
            POWERSHELL_TELEMETRY_OPTOUT=1 \
            HTTP_PROXY= HTTPS_PROXY= ALL_PROXY= NO_PROXY=127.0.0.1,localhost \
            pwsh "$GITHUB_WORKSPACE/build/Test-LocalHostOffline.ps1" \
              -Root "$GITHUB_WORKSPACE" -DataDirectory /tmp/platform-local-offline

      # `always()` makes an attempted connection visible even if the host swallowed the socket
      # error or another assertion stopped the scenario first.
      # verification: true
      - name: Assert the local host attempted no outbound connection
        if: always()
        run: |
          if ! sudo iptables -L PLATFORM_LOCAL_OFFLINE -n >/dev/null 2>&1; then
            echo "the local-host outbound guard was not installed" >&2
            exit 1
          fi

          rejected=$(sudo iptables -L PLATFORM_LOCAL_OFFLINE -v -x -n | \
            awk '$3 == "REJECT" { total += $1 } END { print total + 0 }')
          if [ "$rejected" -ne 0 ]; then
            echo "the local-host run attempted $rejected outbound packet(s)" >&2
            exit 1
          fi
          echo "the local-host run attempted no outbound connections"

  # S3.15: the workload's suite runs from a fresh clone. It is its own job rather than a step in
  # the one above so that "a fresh clone" is literal — this job shares no restored state, no
  # node_modules and no build output with the .NET job, and its only inputs are the checkout and
  # the two vendored package tarballs the workload declares.
  game-service:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # S7.8/S7.9: replay-edge.test.ts spawns the .NET edge as a real child process in front of the
      # spawned Node workload, so the edge must be built before the suite runs. GAME_EDGE_DLL tells
      # the test harness where to find it rather than guessing a configuration string.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build the edge
        run: dotnet build workloads/game-edge/SubZeroDev.Platform.GameEdge/SubZeroDev.Platform.GameEdge.csproj --configuration Release

      # S8.1/S8.2/S8.6: the trace-evidence test's own OTLP sink is a real collector, not a
      # hand-decoded stand-in for either process's wire format (`tests/support/otel-collector.ts`).
      # Pinned to a specific release and checksum-verified, the same as any other build input.
      - name: Install the OpenTelemetry Collector
        run: |
          curl -sL -o otelcol-contrib.tar.gz \
            https://github.com/open-telemetry/opentelemetry-collector-releases/releases/download/v0.158.0/otelcol-contrib_0.158.0_linux_amd64.tar.gz
          echo "7623348c295ec7b00d86c30040a30730f7e3537e813b34c880c1d5abb9bbe8d5  otelcol-contrib.tar.gz" | sha256sum -c -
          tar xzf otelcol-contrib.tar.gz otelcol-contrib
          chmod +x otelcol-contrib

      # S3.13 / invariant 32: with no OTLP endpoint configured the workload must construct no
      # exporter and attempt no outbound connection. Rejecting both OTLP ports before the suite
      # runs is what makes that enforced rather than merely unobserved, exactly as the .NET job
      # does for the sample. Loopback stays open — the suite, and the collector installed above,
      # bind and dial 127.0.0.1 throughout, on ports chosen at run time as well as 4317/4318.
      # That is the whole of the restriction in this job: two TCP ports, for every process it
      # starts. The signed-in-player composition's isolation (G3 S3.8) is enforced and measured in
      # the `game-service-isolation` job below, not here.
      - name: Block outbound OTLP ports for the workload suite
        run: |
          sudo iptables -A OUTPUT -o lo -j ACCEPT
          sudo iptables -A OUTPUT -p tcp --dport 4317 -j REJECT
          sudo iptables -A OUTPUT -p tcp --dport 4318 -j REJECT

      - name: Install the workload's dependencies
        working-directory: workloads/game-service
        run: npm install

      # verification: true
      - name: Typecheck
        working-directory: workloads/game-service
        run: npm run typecheck

      # S9.1/S9.2: workloads/game-service/README.md's own commands, run here rather than a
      # private equivalent -- if a documented command stops existing or stops starting a server
      # that answers its documented health paths, this step is what fails.
      # verification: true
      - name: Start the workload and the edge, the documented way
        run: |
          set -e
          cd workloads/game-service
          HANDOFF_KEYS="$(mktemp -d)"
          openssl ecparam -name prime256v1 -genkey -noout | openssl ec -pubout -out "$HANDOFF_KEYS/local.pem"
          echo "HANDOFF_KEYS=$HANDOFF_KEYS" >> "$GITHUB_ENV"
          GAME_SERVICE_PORT=8080 \
          GAME_SERVICE_HANDOFF_KEYS_DIR="$HANDOFF_KEYS" \
          GAME_SERVICE_HANDOFF_ISSUER=game-edge.local \
          GAME_SERVICE_HANDOFF_AUDIENCE=game-service.local \
            npm start > /tmp/workload.log 2>&1 &
          WORKLOAD_PID=$!
          cd "$GITHUB_WORKSPACE"

          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8080/livez >/dev/null 2>&1 && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8080/livez
          echo
          curl -sf http://127.0.0.1:8080/readyz
          echo

          cd workloads/game-edge/SubZeroDev.Platform.GameEdge/bin/Release/net10.0
          GameEdge__CredentialMode=PassThrough \
          GameEdge__WorkloadBaseAddress=http://127.0.0.1:8080 \
          ASPNETCORE_URLS=http://127.0.0.1:5080 \
          ASPNETCORE_ENVIRONMENT=Production \
            dotnet SubZeroDev.Platform.GameEdge.dll > /tmp/edge.log 2>&1 &
          cd "$GITHUB_WORKSPACE"

          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:5080/health/live >/dev/null 2>&1 && break
            sleep 1
          done
          curl -sf http://127.0.0.1:5080/health/live
          echo
          curl -sf http://127.0.0.1:5080/health/ready
          echo

          pkill -f "SubZeroDev.Platform.GameEdge.dll" || true
          kill "$WORKLOAD_PID" || true

      # verification: true
      - name: Run the replay against the workload
        working-directory: workloads/game-service
        run: npx vitest run tests/replay.test.ts

      # verification: true
      - name: Run the replay against the edge
        working-directory: workloads/game-service
        env:
          GAME_EDGE_DLL: ${{ github.workspace }}/workloads/game-edge/SubZeroDev.Platform.GameEdge/bin/Release/net10.0/SubZeroDev.Platform.GameEdge.dll
        run: npx vitest run tests/replay-edge.test.ts

      # S3: the store's own suite (`tests/store.test.ts` and friends) needs a real PostgreSQL
      # database, not a mock — the same compose file the README will point a reader at
      # (`docker-compose.yml` under this workload), brought up by the identical command. "Test",
      # below, runs the whole suite unconditionally and would otherwise fail here for want of a
      # database rather than for a real defect.
      - name: Start the durable store
        working-directory: workloads/game-service
        run: |
          docker compose up -d
          # A fresh volume makes the official postgres image run a short-lived "temp server" for
          # initdb's own scripts, then stop it and start the real one — pg_isready can report
          # `accepting connections` against that temp server and then `rejecting connections`
          # while it restarts, before settling permanently. One success is not proof; two in a
          # row, a second apart, is.
          consecutive=0
          for i in $(seq 1 60); do
            if docker compose exec -T postgres pg_isready -U game_service -d game_service; then
              consecutive=$((consecutive + 1))
              [ "$consecutive" -ge 2 ] && break
            else
              consecutive=0
            fi
            sleep 1
          done
          if [ "$consecutive" -lt 2 ]; then
            echo "postgres did not report ready twice in a row" >&2
            exit 1
          fi

      # S11.1/S11.2/S11.3: the README's own documented migration command, run here rather than a
      # private equivalent — if it stops existing or stops bringing a fresh schema to head, this
      # step is what fails. Targets its own schema rather than `public`, so it neither depends on
      # nor is depended on by any other step in this job.
      # verification: true
      - name: Migrate the schema to head, the documented way
        working-directory: workloads/game-service
        env:
          GAME_SERVICE_DB_SCHEMA: ci_documented_migrate
        run: npm run migrate

      # S12.11: the README's own documented durable-start command, run here rather than a private
      # equivalent — if it stops existing or stops reaching a serving, ready instance, this step is
      # what fails. Targets its own schema, migrated by the process itself rather than by the step
      # above, so this proves the self-migrating start path specifically.
      # verification: true
      - name: Start the workload against the durable store, the documented way
        working-directory: workloads/game-service
        env:
          GAME_SERVICE_PORT: "8081"
          GAME_SERVICE_STORAGE: durable
          GAME_SERVICE_DB_CONNECTION_STRING: postgresql://game_service:game_service@127.0.0.1:5432/game_service
          GAME_SERVICE_DB_SCHEMA: ci_documented_durable_start
          GAME_SERVICE_HANDOFF_ISSUER: game-edge.local
          GAME_SERVICE_HANDOFF_AUDIENCE: game-service.local
        run: |
          set -e
          GAME_SERVICE_HANDOFF_KEYS_DIR="$HANDOFF_KEYS" npm start > /tmp/durable-workload.log 2>&1 &
          DURABLE_WORKLOAD_PID=$!
          # Runs on every exit path, including a readiness timeout below aborting the script under
          # `set -e` — a backgrounded workload left running past this step would otherwise hold its
          # DB connections and the CI job's process table for the rest of the job.
          trap 'kill "$DURABLE_WORKLOAD_PID" 2>/dev/null || true' EXIT

          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8081/readyz >/dev/null 2>&1 && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8081/readyz || { echo "workload never became ready:"; cat /tmp/durable-workload.log; exit 1; }
          echo

      # S11.1/S11.2: the README's own documented commands, run here rather than a private
      # equivalent — if either stops existing or stops reproducing its proof, this step is what
      # fails.
      # verification: true
      - name: Run the one-instance contention proof
        working-directory: workloads/game-service
        run: npx vitest run tests/contention-one-instance.test.ts

      # S7.5/S7.6: the README's own documented command, run here rather than a private
      # equivalent — if it stops existing or stops reproducing the contention proof, this step
      # is what fails.
      # verification: true
      - name: Run the two-instance contention proof
        working-directory: workloads/game-service
        run: npx vitest run tests/contention-two-instances.test.ts

      # S11.1/S11.2: the README's own documented commands, run here rather than a private
      # equivalent — if either stops existing or stops reproducing its proof, this step is what
      # fails.
      # verification: true
      - name: Run the durable replay
        working-directory: workloads/game-service
        run: npx vitest run tests/durable-replay.test.ts

      # verification: true
      - name: Run the port-conformance suite
        working-directory: workloads/game-service
        run: npx vitest run tests/conformance.test.ts

      # `tests/s3-edge.test.ts` (G3 S3) runs here with the rest of the suite; its isolated run is the
      # `game-service-isolation` job.
      # verification: true
      - name: Test
        working-directory: workloads/game-service
        env:
          GAME_EDGE_DLL: ${{ github.workspace }}/workloads/game-edge/SubZeroDev.Platform.GameEdge/bin/Release/net10.0/SubZeroDev.Platform.GameEdge.dll
          OTEL_COLLECTOR_BIN: ${{ github.workspace }}/otelcol-contrib
        run: npm test

  # G3 S3.8: the signed-in-player composition (the .NET edge in Terminate mode, the real workload,
  # this job's PostgreSQL, the OpenTelemetry Collector and the test harness) needs nothing beyond
  # its own processes. It is its own job so that the isolation is the only thing it varies, and so
  # the evidence it produces is about this composition and not about the Local sample's.
  #
  # Mechanism, as in the build job's local-host guard: an owner-match rule sends every packet of one
  # dedicated operating-system user into a chain that rejects and counts everything except loopback,
  # so the runner's and Actions' own traffic (a different user) cannot contaminate the counters. This
  # job differs in three ways. It installs the chain for IPv6 as well as IPv4, so the unused family
  # is not an open path. It rejects DNS (port 53) ahead of the loopback rule, so a lookup through the
  # runner's loopback resolver is counted instead of invisible. And it asserts that the guard saw the
  # run: a loopback packet count of zero would mean the owner match never matched the processes.
  #
  # What it permits: loopback, which is every endpoint the composition has (edge, workload, the
  # recording tap, the collector, PostgreSQL through its published port, the harness). What it
  # forbids: every non-loopback packet of the dedicated user, over either family, and any DNS query.
  # Dependencies are installed and PostgreSQL is pulled and started before the guard exists.
  game-service-isolation:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build the edge
        run: dotnet build workloads/game-edge/SubZeroDev.Platform.GameEdge/SubZeroDev.Platform.GameEdge.csproj --configuration Release

      - name: Install the OpenTelemetry Collector
        run: |
          curl -sL -o otelcol-contrib.tar.gz \
            https://github.com/open-telemetry/opentelemetry-collector-releases/releases/download/v0.158.0/otelcol-contrib_0.158.0_linux_amd64.tar.gz
          echo "7623348c295ec7b00d86c30040a30730f7e3537e813b34c880c1d5abb9bbe8d5  otelcol-contrib.tar.gz" | sha256sum -c -
          tar xzf otelcol-contrib.tar.gz otelcol-contrib
          chmod +x otelcol-contrib

      - name: Install the workload's dependencies
        working-directory: workloads/game-service
        run: npm install

      - name: Start the durable store
        working-directory: workloads/game-service
        run: |
          docker compose up -d
          # Two consecutive successes: see the same step in the game-service job.
          consecutive=0
          for i in $(seq 1 60); do
            if docker compose exec -T postgres pg_isready -U game_service -d game_service; then
              consecutive=$((consecutive + 1))
              [ "$consecutive" -ge 2 ] && break
            else
              consecutive=0
            fi
            sleep 1
          done
          if [ "$consecutive" -lt 2 ]; then
            echo "postgres did not report ready twice in a row" >&2
            exit 1
          fi

      - name: Install the outbound guard
        run: |
          set -euo pipefail
          . build/outbound-guard.sh

          sudo useradd --system --no-create-home --shell /usr/sbin/nologin "$GUARD_USER"
          workspace_parent=$(dirname "$GITHUB_WORKSPACE")
          work_parent=$(dirname "$workspace_parent")
          runner_home=$(dirname "$work_parent")
          sudo chmod o+x "$runner_home" "$work_parent" "$workspace_parent" "$GITHUB_WORKSPACE"
          sudo -u "$GUARD_USER" test -r "$GITHUB_WORKSPACE/workloads/game-service/package.json"
          sudo install -d -o "$GUARD_USER" -g "$GUARD_USER" /tmp/platform-s3-offline
          # Vite writes its cache and its bundled config under node_modules; the guarded user does not own it.
          mkdir -p workloads/game-service/node_modules/.vite workloads/game-service/node_modules/.vite-temp
          chmod -R a+rwX workloads/game-service/node_modules/.vite workloads/game-service/node_modules/.vite-temp

          # Documentation-range addresses (RFC 5737, RFC 3849) on a dummy interface give the negative
          # control a route that is not loopback, so its packets reach the OUTPUT chain.
          sudo ip link add s3-guard0 type dummy
          sudo ip link set s3-guard0 up
          sudo ip addr add 192.0.2.1/24 dev s3-guard0
          sudo ip -6 addr add 2001:db8::1/64 dev s3-guard0 nodad

          guard_uid=$(id -u "$GUARD_USER")
          for family in 4 6; do
            tool=$(guard_tool "$family")
            sudo "$tool" -N "$GUARD_CHAIN"
            sudo "$tool" -A "$GUARD_CHAIN" -p udp --dport 53 -j REJECT
            sudo "$tool" -A "$GUARD_CHAIN" -p tcp --dport 53 -j REJECT
            sudo "$tool" -A "$GUARD_CHAIN" -o lo -j RETURN
            sudo "$tool" -A "$GUARD_CHAIN" -j REJECT
            sudo "$tool" -I OUTPUT 1 -m owner --uid-owner "$guard_uid" -j "$GUARD_CHAIN"
          done

      # A guard that has never rejected anything is not known to constrain anything. Each probe is
      # made as the guarded user, must fail, and must increment that family's reject counter. DNS is
      # probed on its own because it travels over loopback (the runner's resolver) and is refused by
      # a different rule.
      # verification: true
      - name: Prove the guard rejects IPv4, IPv6 and DNS, and still permits loopback
        run: |
          set -euo pipefail
          . build/outbound-guard.sh

          as_guarded() {
            sudo -u "$GUARD_USER" env HOME=/tmp/platform-s3-offline PATH="$PATH" \
              HTTP_PROXY= HTTPS_PROXY= ALL_PROXY= http_proxy= https_proxy= all_proxy= "$@"
          }
          expect_refused() {
            family=$1; label=$2; shift 2
            before=$(guard_total "$family" REJECT)
            set +e
            as_guarded "$@" >/dev/null 2>&1
            status=$?
            set -e
            after=$(guard_total "$family" REJECT)
            if [ "$status" -eq 0 ] || [ "$after" -le "$before" ]; then
              echo "the guard did not refuse and count the $label probe (exit $status, rejects $before -> $after)" >&2
              exit 1
            fi
            echo "$label: refused and counted (rejects $before -> $after)"
          }

          expect_refused 4 "IPv4 connection" curl --connect-timeout 3 --max-time 5 http://192.0.2.2/
          expect_refused 6 "IPv6 connection" curl --connect-timeout 3 --max-time 5 "http://[2001:db8::2]/"
          expect_refused 4 "DNS query" timeout 30 node -e \
            "require('node:dns').resolve4('s3-control.invalid', (error) => process.exit(error ? 1 : 0))"

          # The permitted path works for the guarded user: PostgreSQL answers on loopback.
          as_guarded node -e \
            "require('node:net').connect(5432, '127.0.0.1').once('connect', () => process.exit(0)).once('error', () => process.exit(1))"
          returned=$(guard_total 4 RETURN)
          if [ "$returned" -eq 0 ]; then
            echo "a loopback connection by the guarded user was not seen by the guard" >&2
            exit 1
          fi

          # The suite starts from zero, so anything counted afterwards came from the suite.
          sudo iptables -Z "$GUARD_CHAIN"
          sudo ip6tables -Z "$GUARD_CHAIN"

      # verification: true
      - name: Run the signed-in player through the edge with outbound networking unavailable
        working-directory: workloads/game-service
        run: |
          . "$GITHUB_WORKSPACE/build/outbound-guard.sh"
          sudo -u "$GUARD_USER" env \
            HOME=/tmp/platform-s3-offline \
            TMPDIR=/tmp/platform-s3-offline \
            PATH="$PATH" \
            DOTNET_CLI_TELEMETRY_OPTOUT=1 \
            DOTNET_SKIP_FIRST_TIME_EXPERIENCE=1 \
            DOTNET_NOLOGO=1 \
            HTTP_PROXY= HTTPS_PROXY= ALL_PROXY= http_proxy= https_proxy= all_proxy= \
            GAME_EDGE_DLL="$GITHUB_WORKSPACE/workloads/game-edge/SubZeroDev.Platform.GameEdge/bin/Release/net10.0/SubZeroDev.Platform.GameEdge.dll" \
            OTEL_COLLECTOR_BIN="$GITHUB_WORKSPACE/otelcol-contrib" \
            ./node_modules/.bin/vitest run tests/s3-edge.test.ts \
              --reporter=default --reporter=json --outputFile.json=/tmp/platform-s3-offline/vitest.json

      # `always()` makes an attempted connection visible even if the code under test swallowed the
      # socket error, or the suite stopped first.
      # verification: true
      - name: Assert the composition attempted no outbound connection and nothing was skipped
        if: always()
        run: |
          set -euo pipefail
          . build/outbound-guard.sh

          for family in 4 6; do
            tool=$(guard_tool "$family")
            if ! sudo "$tool" -L "$GUARD_CHAIN" -n >/dev/null 2>&1; then
              echo "the IPv$family outbound guard was not installed" >&2
              exit 1
            fi
            echo "IPv$family chain after the suite:"
            sudo "$tool" -L "$GUARD_CHAIN" -v -x -n
          done

          failed=0
          for family in 4 6; do
            rejected=$(guard_total "$family" REJECT)
            if [ "$rejected" -ne 0 ]; then
              echo "the composition attempted $rejected outbound IPv$family packet(s)" >&2
              failed=1
            fi
          done
          # The guard must have matched the run: the suite's own loopback traffic is counted.
          returned=$(guard_total 4 RETURN)
          if [ "$returned" -eq 0 ]; then
            echo "the guard saw no loopback traffic from the suite, so it proves nothing" >&2
            failed=1
          fi
          # A skipped test is not evidence: the exported-span proof is skipped without a collector.
          report=/tmp/platform-s3-offline/vitest.json
          if [ ! -s "$report" ]; then
            echo "the suite wrote no report" >&2
            failed=1
          else
            notpassed=$(jq '[.testResults[].assertionResults[] | select(.status != "passed")] | length' "$report")
            total=$(jq '[.testResults[].assertionResults[]] | length' "$report")
            echo "suite: $total test(s), $notpassed not passed"
            if [ "$total" -eq 0 ] || [ "$notpassed" -ne 0 ]; then
              echo "every test in the isolated run must pass; none may be skipped" >&2
              failed=1
            fi
          fi
          [ "$failed" -eq 0 ]
          echo "the composition attempted no outbound connections (loopback packets seen: $returned)"

      - name: Remove the outbound guard
        if: always()
        run: |
          . build/outbound-guard.sh
          guard_uid=$(id -u "$GUARD_USER" 2>/dev/null || true)
          for family in 4 6; do
            tool=$(guard_tool "$family")
            if [ -n "$guard_uid" ]; then
              sudo "$tool" -D OUTPUT -m owner --uid-owner "$guard_uid" -j "$GUARD_CHAIN" 2>/dev/null || true
            fi
            sudo "$tool" -F "$GUARD_CHAIN" 2>/dev/null || true
            sudo "$tool" -X "$GUARD_CHAIN" 2>/dev/null || true
          done
          sudo pkill -KILL -u "$GUARD_USER" 2>/dev/null || true
          sudo ip link del s3-guard0 2>/dev/null || true
          sudo userdel "$GUARD_USER" 2>/dev/null || true

          left=0
          for family in 4 6; do
            if sudo "$(guard_tool "$family")" -S 2>/dev/null | grep -q "$GUARD_CHAIN"; then
              echo "the IPv$family guard is still installed" >&2
              left=1
            fi
          done
          if ip link show s3-guard0 >/dev/null 2>&1; then
            echo "the guard's dummy interface is still present" >&2
            left=1
          fi
          [ "$left" -eq 0 ]
