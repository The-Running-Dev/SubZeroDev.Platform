name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal

      # S8.1: with no OTLP endpoint configured (the sample's appsettings.json carries none), the
      # standard registration call must start no exporter and attempt no outbound connection —
      # neither at startup nor in steady state. Rejecting the two OTLP ports before the sample runs
      # is what makes that an enforced fact rather than an assumption: if telemetry ever tried to
      # reach a collector on either, the run below would hang or fail against a firewall, not merely
      # "happen not to notice" a missing endpoint. Loopback stays open, since curl/dotnet talk to the
      # sample and to each other on 127.0.0.1 throughout the rest of this job; nothing else in this
      # job makes outbound calls, so a narrower reject than a default-deny is sufficient here.
      - name: Block outbound OTLP ports for the sample run
        run: |
          sudo iptables -A OUTPUT -o lo -j ACCEPT
          sudo iptables -A OUTPUT -p tcp --dport 4317 -j REJECT
          sudo iptables -A OUTPUT -p tcp --dport 4318 -j REJECT

      # The sample runs both roles in a non-development environment, so CI exercises the real
      # checks rather than the development carve-outs. build/Test-SampleRoundTrip.ps1 is shared with
      # release.yml's verify-restore job (S9.2/S9.3), which runs the identical script against the
      # sample built from the published packages instead of these project references.
      - name: Run the sample in both roles
        env:
          ASPNETCORE_ENVIRONMENT: Production
        run: pwsh ./build/Test-SampleRoundTrip.ps1
