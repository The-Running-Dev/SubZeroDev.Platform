name: Package Consumers

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pack:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      # verification: true
      - name: Verify the package graph rejection fixtures
        run: pwsh ./build/Test-PackageConsumerGraphFixtures.ps1
      - name: Select the shared CI version
        id: version
        run: echo "value=0.1.0-ci.${{ github.run_number }}.${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
      # verification: true
      - name: Pack and validate all D5 package manifests
        run: pwsh ./build/Test-PackageManifests.ps1 -Version '${{ steps.version.outputs.value }}' -OutputDirectory artifacts/packages
      - uses: actions/upload-artifact@v4
        with:
          name: d5-packages
          path: artifacts/packages/*.nupkg
          if-no-files-found: error

  consume:
    needs: pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/download-artifact@v4
        with:
          name: d5-packages
          path: artifacts/packages
      # verification: true
      - name: Restore and test the sample solution using only Platform artifacts
        run: pwsh ./build/Test-PackageRestore.ps1 -PackageDirectory artifacts/packages -Version '${{ needs.pack.outputs.version }}'
      # verification: true
      - name: Run the packaged sample in both roles
        env:
          ASPNETCORE_ENVIRONMENT: Production
        run: pwsh ./build/Test-SampleRoundTrip.ps1
