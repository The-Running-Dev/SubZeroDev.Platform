name: Release

# S9: packs the shipped packages, publishes them to GitHub Packages as a private feed, restores
# and reruns the sample and the full test suite against those restored packages rather than the
# source tree, builds the API reference, and only then cuts the GitHub release. Triggers on a
# version tag rather than every push to main -- S9.6 ties the published version to the tag, and
# `dotnet pack`/`push` are not something every ordinary merge should repeat. A manual rerun picks
# the existing tag as its ref.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # S9.4: the API reference build is its own job, and every job below that ships or verifies a
  # release depends on it -- a public type without a doc comment fails CS1591 here (see
  # build/Test-ApiReference.ps1) and the release job never runs.
  api-reference:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install docfx
        run: dotnet tool install --global docfx --version 2.78.5

      - name: Build the API reference
        run: pwsh ./build/Test-ApiReference.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: api-reference
          path: artifacts/api-reference

  # The shared dotnet workflow, on the tag:
  # - S9.6: build/Get-ReleaseVersion.ps1 fails a ref that is not a v0.x.y tag before anything is
  #   packed or published.
  # - S9.1, S9.5: build/Test-ReleasePackageManifests.ps1 packs at that version and checks the
  #   produced manifests.
  # - Packs the solution at the tag's version and, S9.2, publishes the packages to GitHub Packages
  #   as a private feed with the workflow's own token -- no separate PAT to hold or rotate.
  # - S9.2's other half and S9.3: build/Test-PublishedPackages.ps1 restores the packages just
  #   published, with authentication, and every S1-S8 assertion runs again against them.
  dotnet:
    needs: api-reference
    permissions:
      contents: write
      packages: write
      id-token: write
    uses: The-Running-Dev/GitHub-ActionTemplates/.github/workflows/dotnet.yml@v0
    with:
      dotnet-version: 10.0.x
      solution: SubZeroDev.Platform.slnx
      test: false
      pack: true
      version-strategy: tag
      pre-build: build/Get-ReleaseVersion.ps1
      post-build: build/Test-ReleasePackageManifests.ps1
      post-publish: build/Test-PublishedPackages.ps1

  # S9.6: the release itself records the API as explicitly unstable.
  github-release:
    needs: [dotnet, api-reference]
    if: needs.dotnet.outputs.published == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: nupkgs

      - uses: actions/download-artifact@v4
        with:
          name: api-reference
          path: api-reference

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: pwsh ./build/New-GitHubRelease.ps1 -PackageDirectory nupkgs -ApiReferenceDirectory api-reference
